# TEMPORARY - exists only to run one measurement and is deleted in the same branch.
name: TMP diag
on:
  push:
    branches: [arena/951bce1b-quotation-studio]
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install QA dependencies
        working-directory: qa
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Install Chromium
        working-directory: qa
        run: npx playwright install --with-deps chromium
      - name: Start local platform server
        run: node platform/local-server/server.js &
      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8787/api/health > /dev/null && echo ready && exit 0
            sleep 1
          done
          exit 1
      - name: Measure page 3
        working-directory: qa
        env:
          QA_BASE: http://127.0.0.1:8787
        run: node tmp-diag.test.js 2>&1 | grep -A40 "DIAG"
      - name: Annotate
        if: always()
        run: echo "diag complete"
