<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Power Proposal — 7-page design preview</title>
<!--
  A viewing harness, not part of the app. It loads the real quotation.html in a
  hidden frame so the real scripts run, calls the real Experience.buildPowerPages(),
  and lays the real Power Proposal pages on the page at 1:1.

  It exists because nobody could see page 3 without downloading a PDF: the owner
  asked for the report's technical page to be exactly page 6 of the full proposal,
  and the only honest way to check that is to look at it. Nothing here duplicates
  any app logic - it calls the app.
-->
<!-- Mirror quotation.html's full stylesheet stack; this outer document displays
     the Power Proposal pages, so omitting the proposal-specific sheets makes the
     preview disagree with the Detailed Proposal reference and the PDF export. -->
<link rel="stylesheet" href="assets/css/app.css?v=sol24">
<link rel="stylesheet" href="assets/css/bess.css">
<link rel="stylesheet" href="assets/css/experience.css?v=power-design3">
<link rel="stylesheet" href="assets/css/control-panel.css?v=start-first-fold2">
<link rel="stylesheet" href="assets/css/studio-assistant.css?v=knowledge3">
<link rel="stylesheet" href="assets/css/document-studio.css?v=document-studio2">
<link rel="stylesheet" href="assets/css/proposal-review.css?v=review-live-items1">
<link rel="stylesheet" href="assets/css/closing.css?v=closing-pdffix1">
<link rel="stylesheet" href="assets/css/terms.css?v=terms-corner3">
<link rel="stylesheet" href="assets/css/proposal-values.css?v=four-icons-corner10">
<link rel="stylesheet" href="assets/css/proposal-polish.css?v=solution-footer2">
<link rel="stylesheet" href="assets/css/proposal-v2.css?v=pv2-2">
<link rel="stylesheet" href="assets/css/workspace-start.css?v=workspace-firstfold3">
<style>
  :root{ --bg:#0f1b26; --ink:#e8eef4; --dim:#9db0c0; --line:#26394a; --ok:#38b87c; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.55 'Poppins','Inter',system-ui,sans-serif;padding:26px 22px 70px;}
  header.top{max-width:1500px;margin:0 auto 22px;}
  h1{font-size:20px;font-weight:600;margin:0 0 6px;letter-spacing:.01em}
  .sub{color:var(--dim);font-size:13.5px;margin:0 0 18px}
  .actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
  button{font:inherit;font-size:13.5px;padding:9px 16px;border-radius:9px;cursor:pointer;
         border:1px solid var(--line);background:#182a38;color:var(--ink);}
  button:hover{background:#20374a}
  button.primary{background:#dc8629;border-color:#dc8629;color:#231303;font-weight:600}
  button.primary:hover{background:#e89542}
  .field{display:inline-flex;align-items:center;gap:8px;background:#182a38;border:1px solid var(--line);
         padding:6px 12px;border-radius:9px;font-size:13px;color:var(--dim)}
  .field input[type=color]{width:30px;height:24px;border:0;background:none;padding:0;cursor:pointer}
  .field input[type=range]{width:120px;accent-color:#dc8629}
  .verdict{margin:16px 0 0;padding:12px 16px;border-radius:10px;font-size:13.5px;
           background:#16232e;border:1px solid var(--line);color:var(--dim)}
  .verdict b{color:var(--ink)}
  .verdict .pass{color:var(--ok);font-weight:600}
  .verdict .fail{color:#ff8a7a;font-weight:600}
  .sheetwrap{max-width:1500px;margin:24px auto 0;overflow-x:auto;padding-bottom:8px}
  .report{display:flex;gap:26px;align-items:flex-start;width:max-content;}
  /* The report's own pages are 794px wide A4 boxes. Shown unscaled so what you see
     is what prints; scroll sideways if the window is narrower. */
  .report .power-page{box-shadow:0 10px 34px rgba(0,0,0,.45);border-radius:2px;flex:0 0 auto;}
  .cap{max-width:1500px;margin:0 auto;color:var(--dim);font-size:12.5px}
  #frame{position:fixed;left:-20000px;top:0;width:1440px;height:1200px;border:0;visibility:hidden}
  .spin{display:inline-block;animation:r 1s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header class="top">
  <h1>Power Proposal — all 7 pages</h1>
  <p class="sub">
    Ye asli report hai: <code>Experience.buildPowerPages()</code> chalta hai, koi dummy markup nahi.
    Saato pages Detailed Proposal ke running header/footer ke saath. Page 3 = full proposal ka Technical Specification.
  </p>
  <div class="actions">
    <button class="primary" id="reload">Report banao</button>
    <span class="field">Scale <input type="range" id="scale" min="40" max="130" value="100"><b id="scaleV">100%</b></span>
    <span class="field">Page <select id="which" style="background:#182a38;color:#e8eef4;border:0;font:inherit">
      <option value="3">3 — Technical specification</option>
      <option value="4">4 — System design</option>
      <option value="6">6 — Investment &amp; payment</option>
      <option value="all" selected>Sab pages</option>
    </select></span>
  </div>
  <div class="verdict" id="verdict"><span class="spin">◐</span> Report ban rahi hai…</div>
</header>

<div class="sheetwrap"><div class="report" id="report"></div></div>

<iframe id="frame" src="quotation.html" title="Quotation Studio (hidden, so the real scripts run)"></iframe>

<script>
(function () {
  'use strict';
  const frame = document.getElementById('frame');
  const report = document.getElementById('report');
  const verdict = document.getElementById('verdict');
  const which = document.getElementById('which');
  const scale = document.getElementById('scale');
  const scaleV = document.getElementById('scaleV');
  let built = null;

  const say = (html) => { verdict.innerHTML = html; };

  function paint() {
    if (!built) return;
    report.innerHTML = '';
    const pages = [...built.querySelectorAll('.power-page')];
    const pick = which.value === 'all' ? pages : pages.filter((p) => p.id === 'powerPage' + which.value);
    pick.forEach((p) => report.appendChild(p.cloneNode(true)));
    applyScale();
  }

  function applyScale() {
    /* zoom is not in every browser, and it changes layout rather than just drawing.
       A transform on the row is predictable: the pages keep their 794px layout and
       are drawn smaller or larger, which is what a zoom control should do. */
    const k = Number(scale.value) / 100;
    scaleV.textContent = Math.round(k * 100) + '%';
    report.style.transformOrigin = 'top left';
    report.style.transform = k === 1 ? '' : 'scale(' + k + ')';
    /* transform does not shrink the box, so the scroll area is told the truth. */
    report.style.width = k === 1 ? 'max-content' : 'max-content';
    const w = report.scrollWidth * k;
    report.parentElement.style.minWidth = w ? Math.ceil(w) + 'px' : '';
  }

  function measure(host) {
    /* Same three things export.js's guard measures: deepest painted content against
       the sheet edge, clearance above the footer, no sideways overflow. Reading the
       guard's own rules here means the browser preview cannot disagree with the PDF. */
    return [...host.querySelectorAll('.power-page')].map((p) => {
      const foot = p.querySelector('footer');
      const body = foot && foot.previousElementSibling;
      const f = foot ? foot.getBoundingClientRect() : null;
      let deepest = '(none)', low = -Infinity;
      p.querySelectorAll('*').forEach((n) => {
        if (n.closest('footer')) return;
        const b = n.getBoundingClientRect();
        if (!b.width && !b.height) return;
        if (b.bottom > low) {
          low = b.bottom;
          deepest = n.tagName.toLowerCase() + (n.id ? '#' + n.id : '') +
            (typeof n.className === 'string' && n.className.trim() ? '.' + n.className.trim().split(/\s+/).join('.') : '');
        }
      });
      const top = p.getBoundingClientRect().top;
      return {
        id: p.id,
        deep: Math.round(low - top),
        sheet: p.clientHeight,
        gap: f && body ? Math.round(f.top - body.getBoundingClientRect().bottom) : null,
        fit: p.scrollWidth <= p.clientWidth + 1,
        deepest,
      };
    });
  }

  function build() {
    const w = frame.contentWindow, d = frame.contentDocument;
    if (!w || !w.Experience || !w.Experience.buildPowerPages) {
      say('App load nahi hui. <code>quotation.html</code> khol ke dekho console me error to nahi.');
      return;
    }
    if (!w.Render || !w.Render.lastState) { say('App ne abhi state nahi banai — thoda ruk ke dobara try karo.'); return; }

    let host = null;
    try {
      host = w.Experience.buildPowerPages(w.Render.lastState);
    } catch (e) {
      say('<b class="fail">Report build fail:</b> ' + (e && e.message ? e.message : e));
      return;
    }
    if (!host) { say('Report build ne kuch return nahi kiya.'); return; }

    /* buildPowerPages() appends its host to the hidden frame's body. Measure there,
       then move the pages into this document so they are visible at 1:1. */
    const rows = measure(host);
    built = host;
    paint();

    const page3 = host.querySelector('#powerPage3');
    const cards = page3 ? page3.querySelectorAll('.pv2-card') : [];
    const badges = page3 ? page3.querySelectorAll('.pv2-brand') : [];
    const photos = page3 ? page3.querySelectorAll('.pv2-photo img') : [];
    const block = page3 ? page3.querySelector('.power-spec-sheet') : null;

    const bad = rows.filter((r) => !(r.deep <= r.sheet && (r.gap === null || r.gap >= 4) && r.fit));
    const scaleApplied = block && block.dataset.powerScale ? block.dataset.powerScale : 'n/a';

    say(
      '<b>' + rows.length + ' pages</b> · ' +
      'page 3 pe <b>' + cards.length + ' cards</b>, ' +
      '<b>' + badges.length + ' badges</b>, ' +
      '<b>' + photos.length + ' photos</b> · ' +
      'scale <b>' + scaleApplied + '</b><br>' +
      (bad.length
        ? '<b class="fail">' + bad.length + ' page(s) A4 se bahar:</b> ' +
          bad.map((r) => r.id + ' gap=' + r.gap + ' deep=' + r.deep + '/' + r.sheet + ' fit=' + r.fit).join(' · ')
        : '<span class="pass">Sab ' + rows.length + ' pages A4 me fit hain.</span>')
    );
    window.__preview = { rows, cards: cards.length, scaleApplied, host };
    console.log('Power preview', window.__preview.rows);
  }

  document.getElementById('reload').addEventListener('click', build);
  which.addEventListener('change', paint);
  scale.addEventListener('input', applyScale);

  frame.addEventListener('load', () => {
    /* The app boots itself; wait for a state to exist rather than guessing a delay. */
    let tries = 0;
    const tick = () => {
      const w = frame.contentWindow;
      if (w && w.Render && w.Render.lastState) { build(); return; }
      if (++tries > 120) { say('App ne 12 second me state nahi banai. Console me error dekho.'); return; }
      setTimeout(tick, 100);
    };
    setTimeout(tick, 400);
  });
})();
</script>
</body>
</html>
