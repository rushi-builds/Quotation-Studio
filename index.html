<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KTM Quotation Studio</title>
  <style>
    body{margin:0;font-family:Inter,system-ui,sans-serif;background:#EEF1F5;color:#1C2B3F;
      min-height:100vh;display:grid;place-items:center;padding:24px;}
    .card{background:#fff;border:1px solid #E4E8EE;border-radius:16px;padding:28px 26px;
      max-width:420px;width:100%;box-shadow:0 12px 32px rgba(28,43,63,.06);}
    h1{font-size:20px;margin:0 0 6px;font-family:Poppins,Inter,sans-serif;}
    p{font-size:13.5px;color:#5B6472;line-height:1.5;margin:0 0 18px;}
    a{display:block;text-align:center;text-decoration:none;font-weight:600;font-size:14px;
      padding:12px;border-radius:10px;margin-bottom:8px;}
    a.primary{background:#F2811D;color:#fff;}
    a.primary:hover{background:#D96A0E;}
    a.secondary{background:#F4F6F8;color:#1C2B3F;border:1px solid #DFE3E8;}
    a.secondary:hover{border-color:#F2811D;color:#D96A0E;}
    .note{font-size:11.5px;color:#8A93A0;margin-top:12px;line-height:1.45;}
  </style>
</head>
<body>
  <div class="card">
    <h1>KTM Quotation Studio</h1>
    <p>Build solar EPC proposals in the Studio, or manage cloud drafts from the staff Dashboard.</p>
    <a class="primary" href="quotation.html">Open Studio</a>
    <a class="secondary" href="dashboard.html">Staff Dashboard</a>
    <p class="note">Dashboard needs the platform server (<code>node platform/local-server/server.js</code>) or a Cloudflare deploy. Studio still works offline in the browser alone.</p>
  </div>
</body>
</html>
