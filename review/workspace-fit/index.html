<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workspace fit · visual review</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#edf2f7;font:12px Arial,sans-serif}header{height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#182b40;color:#fff;gap:8px}header span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}a{color:#ffe2a2;text-decoration:none;margin-left:12px}iframe{display:block;border:0;width:100%;height:calc(100dvh - 32px)}#error{padding:24px;color:#182b40}</style></head>
<body><header><span>VISUAL REVIEW · Sample records only · No live access or saving</span><nav><a href="?panel=home">Overview</a><a href="?panel=sales">Pulse</a></nav></header><iframe title="Actual Studio layout with isolated sample records" sandbox="allow-scripts allow-same-origin"></iframe>
<script>
(async()=>{
  try {
    const base=new URL('../../',location.href).href;
    const response=await fetch(new URL('dashboard.html',base));
    if(!response.ok)throw Error('Dashboard could not be loaded');
    let html=await response.text();
    html=html.replace('<head>','<head><base href="'+base+'">');
    // Actual dashboard markup, CSS and controllers; only the API client is
    // replaced inside this review frame. Production never loads this fixture.
    html=html.replace(/assets\/js\/platform-api\.js[^"']*/, 'review/workspace-fit/fixtures.js');
    document.querySelector('iframe').srcdoc=html;
  } catch(e) {document.querySelector('iframe').replaceWith(Object.assign(document.createElement('p'),{id:'error',textContent:e.message}));}
})();
</script></body></html>
